<script>
    function validateForm() {
        var t = document.getElementById("das").value;
        var r = document.querySelector('input[type="password"]').value;

        if(t == "" || r == ""){
            alert("Please fill all the details");
            return false;
        }
        else{
            alert("Login Successful");
            return true;
        }
